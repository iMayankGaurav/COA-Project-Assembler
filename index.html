<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Assembler</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Assembler & Disassembler</h1>

    <div class="container">
        <div class="editor-box">
            <label for="assemblyInput">Assembly Code</label>
            <textarea id="assemblyInput" spellcheck="false">// Initialize registers
mov r1, 5
mov r2, 10

// Perform some arithmetic
add r3, r1, r2
mul r4, r3, 2

// Compare and branch
cmp r4, 30
beq 12

// Halt execution
hlt</textarea>
        </div>

        <div class="controls">
            <button onclick="assemble()">Assemble &rarr;</button>
            <button class="btn-disassemble" onclick="disassemble()">&larr; Disassemble</button>
        </div>

        <div class="editor-box">
            <label for="machineInput">Machine Code (Binary)</label>
            <textarea id="machineInput" spellcheck="false"></textarea>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
